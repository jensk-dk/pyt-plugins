[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "myapp-example-plugin2"
version = "0.1.0"
description = "Example plugin 2 — timestamp"
requires-python = ">=3.10"
dependencies = ["myapp-plugin-sdk"]

[project.entry-points."myapp.plugins"]
timestamp = "myapp_example_plugin2.plugin:TimestampPlugin"

[tool.setuptools.packages.find]
include = ["myapp_example_plugin2*"]
